name: linesentry

# On-prem stack: nginx-served frontend + Rust backend + MongoDB + Redis.
# Copy deploy/.env.example to deploy/.env and fill in the secrets first.
#   docker compose -f deploy/docker-compose.yml up -d --build

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      BIND_ADDR: 0.0.0.0:3001
      MONGODB_URI: mongodb://mongo:27017/industrial_iot
      DB_NAME: industrial_iot
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      DAEMON_API_KEY: ${DAEMON_API_KEY:?set DAEMON_API_KEY in deploy/.env}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  redis-data:
