[package]
name = "linesentry-daemon"
version = "0.1.0"
edition = "2021"
description = "LineSentry edge daemon — reads PLC digital signals and posts them to the backend"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
anyhow = "1"
rand = "0.8"

# Siemens S7 PLC reader (FFI to libsnap7). Optional + feature-gated so the daemon
# builds and runs in simulator mode everywhere; enable with `--features plc` on
# the Raspberry Pi / target where libsnap7 is available.
snap7-rs = { version = "1", optional = true }

[features]
default = []
plc = ["dep:snap7-rs"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
